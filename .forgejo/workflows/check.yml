name: Linux checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_PROFILE_DEV_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Prepare native dependencies and isolated temporary storage
        run: |
          set -euo pipefail
          privilege=()
          if [ "$(id -u)" -ne 0 ]; then privilege=(sudo); fi
          "${privilege[@]}" apt-get update
          "${privilege[@]}" apt-get install -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev
          "${privilege[@]}" install -d -m 1777 /data/temp
          task_tmp=$(mktemp -d /data/temp/pulseterm-forgejo.XXXXXX)
          echo "TMPDIR=$task_tmp" >> "$GITHUB_ENV"
          echo "TMP=$task_tmp" >> "$GITHUB_ENV"
          echo "TEMP=$task_tmp" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$task_tmp/target" >> "$GITHUB_ENV"
          mkdir -p target/probes/forgejo-check
          git rev-parse HEAD > target/probes/forgejo-check/commit.txt
          sha256sum .mise.toml Cargo.lock pnpm-lock.yaml > target/probes/forgejo-check/inputs.sha256
      - uses: https://github.com/jdx/mise-action@v3
        with:
          github_token: ''
          cache: false
      - run: mise run bootstrap
      - name: Check core code and all platform feature targets
        run: |
          set -euo pipefail
          mise run check 2>&1 | tee target/probes/forgejo-check/check.log
          mise run check-core-features 2>&1 | tee target/probes/forgejo-check/core-features.log
      - name: Test native Linux components and receipt handling
        run: |
          set -euo pipefail
          mise run check-platform 2>&1 | tee target/probes/forgejo-check/platform.log
          mise run test-ssh-agent-transport 2>&1 | tee target/probes/forgejo-check/agent.log
          mise run test-cli-transport 2>&1 | tee target/probes/forgejo-check/cli.log
          mise run check-windows-product-runner 2>&1 | tee target/probes/forgejo-check/windows-receipt-runner.log
          mise exec -- node --test scripts/test-windows-ssh-config.test.mjs 2>&1 | tee target/probes/forgejo-check/config-receipt-runner.log
      - name: Run unit tests and headless terminal consistency probe
        run: |
          set -euo pipefail
          mise run test 2>&1 | tee target/probes/forgejo-check/test.log
          mise run probe 2>&1 | tee target/probes/forgejo-check/probe.log
      - name: Build frontend before checking the complete production adapter
        run: |
          set -euo pipefail
          mise exec -- pnpm --filter ui build 2>&1 | tee target/probes/forgejo-check/frontend.log
          mise run check-ssh-adapters 2>&1 | tee target/probes/forgejo-check/desktop.log
      # Forgejo's artifact protocol requires v3, not GitHub's v4 service.
      - name: Upload check evidence
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v3
        with:
          name: linux-checks-${{ github.run_id }}
          path: target/probes/
          if-no-files-found: warn
      - name: Remove this job's temporary storage
        if: always()
        run: |
          case "${TMPDIR:-}" in
            /data/temp/pulseterm-forgejo.*) rm -rf -- "$TMPDIR" ;;
            '') ;;
            *) exit 1 ;;
          esac

  release-gates:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Prepare isolated temporary storage
        run: |
          set -euo pipefail
          privilege=()
          if [ "$(id -u)" -ne 0 ]; then privilege=(sudo); fi
          "${privilege[@]}" install -d -m 1777 /data/temp
          task_tmp=$(mktemp -d /data/temp/pulseterm-forgejo-gates.XXXXXX)
          echo "TMPDIR=$task_tmp" >> "$GITHUB_ENV"
          echo "TMP=$task_tmp" >> "$GITHUB_ENV"
          echo "TEMP=$task_tmp" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$task_tmp/target" >> "$GITHUB_ENV"
          mkdir -p target/probes/forgejo-gates
          git rev-parse HEAD > target/probes/forgejo-gates/commit.txt
      - uses: https://github.com/jdx/mise-action@v3
        with:
          github_token: ''
          cache: false
      - run: mise run bootstrap
      - name: Audit dependencies without suppressing known advisories
        run: |
          set -euo pipefail
          mise run audit 2>&1 | tee target/probes/forgejo-gates/audit.log
      - name: Require complete attribution texts even after audit failure
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mise run third-party-release-check 2>&1 | tee target/probes/forgejo-gates/attribution.log
      - name: Upload release-gate failures and raw audit receipts
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v3
        with:
          name: release-gates-${{ github.run_id }}
          path: target/probes/
          if-no-files-found: warn
      - name: Remove this job's temporary storage
        if: always()
        run: |
          case "${TMPDIR:-}" in
            /data/temp/pulseterm-forgejo-gates.*) rm -rf -- "$TMPDIR" ;;
            '') ;;
            *) exit 1 ;;
          esac
