[package]
name = "pulse-pty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
portable-pty.workspace = true
pulse-core.workspace = true
thiserror.workspace = true

# portable-pty 0.9 logs registry environment values at trace while building a Windows command.
# Compile those records out even when a caller enables a trace logger (also affects other log targets).
[target.'cfg(windows)'.dependencies]
log = { workspace = true, features = ["max_level_debug"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
