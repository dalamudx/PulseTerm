[package]
name = "pulse-ssh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
managed-store = ["dep:pulse-store", "pulse-store/ssh-trust", "dep:uuid"]

[dependencies]
tokio.workspace = true
pulse-core.workspace = true
pulse-store = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
russh = { version = "=0.63.3", default-features = false, features = ["ring"] }
thiserror.workspace = true
base64.workspace = true
hmac = "=0.13.0"
sha1 = "=0.11.0"
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[dev-dependencies]
rand = "0.10"
[target.'cfg(unix)'.dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
