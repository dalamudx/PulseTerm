name: Check

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo install -d -m 1777 /data/temp
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends fonts-droid-fallback fonts-noto-mono fonts-urw-base35 libwebkit2gtk-4.1-dev libgtk-3-dev at-spi2-core xvfb dbus-x11 openbox x11-utils xdotool imagemagick tesseract-ocr openssh-client openssh-server vim less htop tmux strace ibus ibus-gtk3 ibus-libpinyin fcitx5 fcitx5-pinyin fcitx5-frontend-gtk3 tesseract-ocr-chi-sim fonts-noto-cjk
      - uses: jdx/mise-action@v3
      - name: Temporary storage
        if: runner.os != 'Windows'
        shell: bash
        run: |
          scratch=$(mktemp -d "$RUNNER_TEMP/pulseterm.XXXXXX")
          scratch=$(cd "$scratch" && pwd -P)
          chmod 700 "$scratch"
          for name in TMPDIR TMP TEMP; do
            printf '%s=%s\n' "$name" "$scratch" >> "$GITHUB_ENV"
          done
      - run: mise run bootstrap
        id: bootstrap
      - name: Core
        run: mise run ci-core
      - name: CLI transport
        if: runner.os == 'Linux' || runner.os == 'Windows'
        run: mise run test-cli-transport
      - name: Windows config
        if: runner.os == 'Windows'
        run: mise run test-windows-ssh-config
      - name: Unix
        if: runner.os != 'Windows'
        run: mise run ci-unix
      - name: Linux protocols
        if: runner.os == 'Linux'
        run: mise run ci-linux
      - name: Workspace
        if: runner.os == 'Linux'
        run: mise run ci-workspace
      - name: Appearance
        if: runner.os == 'Linux'
        run: mise run ci-appearance
      - name: Validation windows
        if: runner.os == 'Linux'
        run: mise run ci-window
      - name: License texts
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.bootstrap.outcome == 'success' }}
        run: mise run third-party-release-check
      - name: Audit
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.bootstrap.outcome == 'success' }}
        run: mise run audit
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-probe-${{ matrix.os }}
          path: |
            target/probes/*.json
            target/probes/windows-product-native/**
            target/probes/windows-cli/**
            target/probes/dependency-audit/**
            target/probes/distribution-review*.log
            target/probes/distribution-review*.md
            target/probes/distribution-review-graphs/**
            target/probes/third-party-*.log
            target/probes/workspace-*.log
            target/probes/workspace-profiles-round-*.png
            target/probes/workspace-fingerprint-*
            target/probes/workspace-ssh-session-*
            target/probes/workspace-close-duplicate-*.png
            target/probes/window-manager.log
            target/probes/window-external-actions.log
          if-no-files-found: ignore
      - name: Attribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: third-party-${{ matrix.os }}
          path: |
            NOTICE
            THIRD_PARTY.md
            third-party/**
          if-no-files-found: error

  terminal-load:
    name: Linux load
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Temporary storage
        run: |
          sudo install -d -m 1777 /data/temp
          load_tmp=$(mktemp -d /data/temp/pulseterm-load-ci.XXXXXX)
          echo "TMPDIR=$load_tmp" >> "$GITHUB_ENV"
          echo "TMP=$load_tmp" >> "$GITHUB_ENV"
          echo "TEMP=$load_tmp" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$load_tmp/target" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@v3
      - name: Linux dependencies
        timeout-minutes: 15
        run: |
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends fonts-droid-fallback fonts-noto-mono fonts-urw-base35 libwebkit2gtk-4.1-dev libgtk-3-dev at-spi2-core xvfb dbus-x11 openbox x11-utils xdotool imagemagick tesseract-ocr
      - run: mise run bootstrap
      - name: Load and startup
        run: |
          mise run probe-workspace-load-state
          mise run probe-workspace-startup
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-load-linux
          path: |
            target/probes/workspace-load/**
            target/probes/workspace-startup/**
          if-no-files-found: warn
      - name: Cleanup
        if: always()
        run: |
          case "$TMPDIR" in
            /data/temp/pulseterm-load-ci.*) rm -rf -- "$TMPDIR" ;;
            *) exit 1 ;;
          esac
