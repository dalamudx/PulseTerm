name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools from .mise.toml
        uses: jdx/mise-action@v3
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb dbus-x11
      - name: Install JavaScript dependencies
        run: mise run bootstrap
      - name: Check code
        run: mise run check
      - name: Verify approved terminal source patch
        run: mise run terminal-vendor-check
      - name: Test upstream terminal source
        run: mise run terminal-vendor-test
      - name: Test code
        run: mise run test
      - name: Check shared Unicode table
        run: mise run unicode-table-check
      - name: Check production terminal API isolation
        run: mise run terminal-api-check
      - name: Validate ordered reconnect and history replay
        run: mise run probe-attachment
      - name: Validate terminal restore continuation
        run: mise run probe-snapshot
      - name: Compare terminal parsers
        run: mise run probe
      - name: Compare Unicode providers
        run: pnpm --filter ui exec tsx scripts/unicode-probe.ts
      - name: Exercise supervised native session actor
        run: mise run probe-local-session
      - name: Exercise native PTY on all platforms
        run: mise run probe-pty-portable
      - name: Exercise Unix native PTY
        if: runner.os != 'Windows'
        run: mise run probe-pty
      - name: Check native desktop adapter
        run: mise run desktop-check
      - name: Check generated IPC bindings
        run: mise run bindings-check
      - name: Test native desktop adapter
        run: mise exec -- cargo test -p pulseterm-desktop --features desktop --locked
      - name: Measure Linux native WebView
        if: runner.os == 'Linux'
        run: mise run probe-channel
      - name: Audit dependencies
        if: runner.os == 'Linux'
        run: mise run audit
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-probe-${{ matrix.os }}
          path: target/probes/*.json
          if-no-files-found: ignore
