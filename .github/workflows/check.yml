name: Check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo install -d -m 1777 /data/temp
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev openssh-client
      - uses: jdx/mise-action@v3
      - name: Temporary storage
        if: runner.os != 'Windows'
        shell: bash
        run: |
          scratch=$(mktemp -d "$RUNNER_TEMP/pulseterm.XXXXXX")
          scratch=$(cd "$scratch" && pwd -P)
          chmod 700 "$scratch"
          for name in TMPDIR TMP TEMP; do
            printf '%s=%s\n' "$name" "$scratch" >> "$GITHUB_ENV"
          done
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target/debug
          key: checks-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.mise.toml', '.cargo/config.toml', '.github/workflows/check.yml') }}
      - run: mise run bootstrap
      - run: mise run ci-core
      - name: Platform
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) mise run test-cli-transport; mise run ci-unix; mise run ci-product ;;
            macOS) mise run test-cli-transport; mise run ci-unix ;;
            Windows) mise run check-windows-settings; mise run test-cli-transport; mise run test-windows-ssh-config ;;
          esac
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-${{ matrix.os }}
          path: |
            target/probes/**/*.json
            target/probes/**/*.log
          if-no-files-found: ignore

  release-gates:
    name: Release gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - name: Temporary storage
        run: |
          sudo install -d -m 1777 /data/temp
          scratch=$(mktemp -d /data/temp/pulseterm-release.XXXXXX)
          for name in TMPDIR TMP TEMP; do
            printf '%s=%s\n' "$name" "$scratch" >> "$GITHUB_ENV"
          done
      - run: mise run bootstrap
        id: bootstrap
      - name: Attribution
        run: mise run third-party-check
      - name: Dependency scope
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: mise run distribution-review
      - name: License texts
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: mise run third-party-release-check
      - name: Audit
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: |
          mise run audit-check
          mise run audit
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gates
          path: |
            target/probes/dependency-audit/**
            target/probes/distribution-review*
            target/probes/third-party*
            NOTICE
            THIRD_PARTY.md
            third-party/**
