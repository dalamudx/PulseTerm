name: Validation

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Acceptance suite (all runs independent jobs)
        type: choice
        required: true
        default: auth
        options: [auth, cli, terminal, catalogue, linux, appearance, window, load, all]

permissions:
  contents: read

jobs:
  validation:
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suite == 'all' && '["auth","cli","terminal","catalogue","linux","appearance","window","load"]' || format('["{0}"]', inputs.suite)) }}
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        timeout-minutes: 15
        run: |
          sudo install -d -m 1777 /data/temp
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends fonts-droid-fallback fonts-noto-mono fonts-urw-base35 libwebkit2gtk-4.1-dev libgtk-3-dev at-spi2-core xvfb dbus-x11 openbox x11-utils xdotool imagemagick tesseract-ocr openssh-client openssh-server vim less htop tmux strace ibus ibus-gtk3 ibus-libpinyin fcitx5 fcitx5-pinyin fcitx5-frontend-gtk3 tesseract-ocr-chi-sim fonts-noto-cjk
      - uses: jdx/mise-action@v3
      - name: Temporary storage
        run: |
          scratch=$(mktemp -d /data/temp/pulseterm-validation.XXXXXX)
          for name in TMPDIR TMP TEMP; do
            printf '%s=%s\n' "$name" "$scratch" >> "$GITHUB_ENV"
          done
          echo "CARGO_TARGET_DIR=$scratch/target" >> "$GITHUB_ENV"
      - run: mise run bootstrap
      - name: Validate
        env:
          SUITE: ${{ matrix.suite }}
        run: mise run "ci-$SUITE"
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.suite }}
          path: |
            target/probes/**/*.json
            target/probes/**/*.log
            target/probes/**/*.png
            target/probes/**/*.txt
            target/probes/**/*.csv
          if-no-files-found: warn
