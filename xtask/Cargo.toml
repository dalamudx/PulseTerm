[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
ssh-probe = ["dep:russh", "dep:rand", "dep:tempfile"]

[dependencies]
anyhow.workspace = true
pulse-core.workspace = true
pulse-ipc.workspace = true
pulse-term = { workspace = true, features = ["validation"] }
pulse-pty.workspace = true
pulse-app.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }
russh = { version = "=0.63.3", default-features = false, features = ["ring"], optional = true }
rand = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }
serde_json.workspace = true

[lints]
workspace = true
