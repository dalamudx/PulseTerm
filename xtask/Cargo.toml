[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
cli-probe = ["dep:tempfile", "dep:uuid", "dep:zeroize"]
ssh-probe = ["dep:russh", "dep:rand", "dep:tempfile", "dep:encoding_rs"]

[dependencies]
anyhow.workspace = true
pulse-core.workspace = true
pulse-ipc.workspace = true
pulse-term = { workspace = true, features = ["validation"] }
pulse-pty.workspace = true
portable-pty.workspace = true
pulse-app.workspace = true
pulse-route.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }
russh = { version = "=0.63.3", default-features = false, features = ["ring"], optional = true }
rand = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }
encoding_rs = { version = "=0.8.42", optional = true }
serde_json.workspace = true
uuid = { workspace=true, optional=true }
zeroize = { workspace=true, optional=true }

[lints]
workspace = true
