[tasks.probe-workspace-font]
description = "Validate bundled font preset explicit save, OFL notice, missing-primary fallback and same-PTY output in a real WebView"
env = { GDK_BACKEND = "x11", LIBGL_ALWAYS_SOFTWARE = "1", WEBKIT_DISABLE_DMABUF_RENDERER = "1", PYTHONDONTWRITEBYTECODE = "1" }
run = """
set -eu
case "${PULSE_FONT_SCALE:-1}" in
  1) font_screen=1280x800x24 ;;
  2) font_screen=2560x1600x24 ;;
  *) echo 'font.invalid_scale' >&2; exit 1 ;;
esac
export GDK_SCALE="${PULSE_FONT_SCALE:-1}" GDK_DPI_SCALE=1
mkdir -p /data/temp target/probes
printf '%s\\n' '{"version":1,"passed":false,"nativeExitConfirmed":false}' >target/probes/workspace-font-result.json
fixture_dir=$(mktemp -d /data/temp/pt-font.XXXXXX)
trap 'rm -rf -- "$fixture_dir"' EXIT
export TMPDIR="$fixture_dir" TMP="$fixture_dir" TEMP="$fixture_dir"
export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$fixture_dir/target}"
