[tasks.probe-workspace-history-stop]
description = "Verify actual 100000-row PTY history search stop, retained page, renewed search, EOF read and native drain"
env = { GDK_BACKEND = "x11", LIBGL_ALWAYS_SOFTWARE = "1", WEBKIT_DISABLE_DMABUF_RENDERER = "1", PYTHONDONTWRITEBYTECODE = "1", PULSE_HISTORY_STOP = "1" }
run = """
set -eu
mkdir -p /data/temp target/probes/workspace-history-stop
printf '%s\\n' '{"version":1,"passed":false,"nativeExitConfirmed":false}' >target/probes/workspace-history-stop/result.json
fixture_dir=$(mktemp -d /data/temp/pt-hstop.XXXXXX)
trap 'rm -rf -- "$fixture_dir"' EXIT
export TMPDIR="$fixture_dir" TMP="$fixture_dir" TEMP="$fixture_dir"
export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$fixture_dir/target}"
cc -Wall -Wextra -Werror scripts/probe-x11-status.c -o "$fixture_dir/x11-status" $(pkg-config --cflags --libs atspi-2 gio-2.0 gobject-2.0 glib-2.0)
pnpm --filter ui exec vite build --outDir "$fixture_dir/ui-dist"
export TAURI_CONFIG=$(printf '{"build":{"frontendDist":"%s/ui-dist"}}' "$fixture_dir")
cargo build -p pulseterm-desktop --features workspace-cli,workspace-ssh,tauri/custom-protocol --bin pulseterm-workspace --locked
export PULSE_NATIVE_HELPER="$fixture_dir/x11-status"
timeout --kill-after=5s 180s xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- sh scripts/probe-window-x11.sh target/probes/workspace-history-stop/wm.log sh scripts/probe-workspace-settings.sh
"""
