[tools]
rust = "1.95.0"
node = "22.23.3"
pnpm = "10.34.6"
"cargo:cargo-deny" = "0.20.2"

[tasks.bootstrap]
description = "Install JavaScript dependencies from the lockfile"
run = "pnpm install --frozen-lockfile"

[tasks.check]
description = "Check Rust and TypeScript code"
run = ["cargo xtask check", "pnpm --filter ui check"]

[tasks.test]
description = "Run unit and shared-fixture tests"
run = ["cargo test --workspace --locked", "pnpm --filter ui test"]

[tasks.probe]
description = "Compare Rust terminal state and xterm headless"
run = ["cargo xtask probe", "pnpm --filter ui probe"]

[tasks.probe-route-ssh-pressure]
description = "Verify real SSH ACK pressure, detach and timeout through HTTP and SOCKS byte routes"
run = "cargo run -p xtask --features ssh-probe --locked -- probe-route-ssh-pressure"

[tasks.probe-route]
description = "Exercise real HTTP CONNECT and SOCKS5 byte-route composition and refusal"
run = "cargo xtask probe-route"

[tasks.probe-software]
description = "Record vim/less/htop/tmux native streams and compare headless recovery"
run = ["cargo xtask probe-software", "pnpm --filter ui exec tsx scripts/software-probe.ts"]

[tasks.probe-local-session]
description = "Exercise the supervised native PTY to terminal actor bridge"
run = "cargo xtask probe-local-session"

[tasks.probe-pty-portable]
description = "Exercise native PTY with a platform-neutral finite Rust helper"
run = "cargo xtask probe-pty-portable"

[tasks.probe-local-profile-session]
description = "Validate login profile bootstrap to terminal actor, authorized ACK backpressure and EOF"
run = "cargo xtask probe-local-profile-session"

[tasks.probe-login-arguments]
description = "Validate explicit Unix login arguments, literal profile argv and no program fallback"
run = "cargo xtask probe-login-arguments"

[tasks.probe-shell-startup]
description = "Validate isolated Bash startup config, scalar/array hooks and OSC prompt boundaries"
run = "cargo xtask probe-shell-startup"

[tasks.probe-login]
description = "Validate Unix public login builder argv0 and fallback limitations"
run = "cargo xtask probe-login"

[tasks.probe-profiles]
description = "Exercise Unix shell discovery, profile reconciliation and literal native launch"
run = "cargo xtask probe-profiles"

[tasks.probe-pty]
description = "Exercise native PTY input, queries, resize, output and teardown"
run = "cargo xtask probe-pty"

[tasks.unicode-table]
description = "Generate xterm scalar widths from locked Rust Unicode table"
run = "cargo xtask unicode-table"

[tasks.unicode-table-check]
description = "Check deterministic shared width table without writing"
run = "cargo xtask unicode-table-check"

[tasks.probe-unicode]
description = "Compare explicit character and grapheme providers (diagnostic, not S2 acceptance)"
depends = ["probe"]
run = "pnpm --filter ui exec tsx scripts/unicode-probe.ts"

[tasks.probe-attachment]
description = "Validate binary reconnect ordering, history, UTF-8 tails and rendering ACKs"
run = ["cargo xtask probe-attachment", "pnpm --filter ui exec tsx scripts/attachment-probe.ts"]

[tasks.probe-snapshot]
description = "Check exact restore continuations; report parser disagreements separately"
run = [
  "cargo xtask probe-snapshot",
  "pnpm --filter ui exec tsx scripts/snapshot-probe.ts",
  "pnpm --filter ui exec tsx scripts/token-matrix.ts",
]

[tasks.terminal-vendor-check]
description = "Verify locked terminal source differs only by the approved getter"
run = "node scripts/check-terminal-vendor.mjs"

[tasks.terminal-vendor-test]
description = "Run upstream terminal tests with isolated locked dependencies"
run = "node scripts/check-terminal-vendor.mjs --test"

[tasks.terminal-api-check]
description = "Prove production terminal API cannot use legacy replay or EchoTransport"
run = "node scripts/check-terminal-api.mjs"

[tasks.fmt]
description = "Format Rust and TypeScript code"
run = ["cargo fmt --all", "pnpm --filter ui format"]

[tasks.desktop-cli-build]
description = "Build explicit fixed CLI-to-window validation adapter"
run = ["pnpm --filter ui build", "cargo build -p pulseterm-desktop --features cli-window-probe --locked"]

[tasks.probe-cli-window]
description = "Measure authenticated CLI request to real native window receipts"
depends = ["desktop-cli-build"]
run = "cargo run -p xtask --features cli-probe --locked -- probe-cli-window"

[tasks.probe-cli-startup]
description = "Validate fixed CLI runtime election, live endpoint preservation and owned crash recovery"
run = "cargo run -p xtask --features cli-probe --locked -- probe-cli-startup"

[tasks.probe-cli]
description = "Validate authenticated fixed read-only CLI RPC over a private Unix socket"
run = "cargo run -p xtask --features cli-probe --locked -- probe-cli"

[tasks.probe-ssh]
description = "Validate isolated loopback SSH host keys, authentication and PTY channels"
run = "cargo run -p xtask --features ssh-probe --locked -- probe-ssh"

[tasks.probe-ssh-system]
description = "Validate russh against an isolated real OpenSSH server and native PTY"
run = "cargo run -p xtask --features ssh-probe --locked -- probe-ssh-system"

[tasks.probe-ssh-pressure]
description = "Verify remote SSH stalls on withheld ACK and expose connection-level blocking"
run = "cargo run -p xtask --features ssh-probe --locked -- probe-ssh-pressure"

[tasks.probe-ssh-jump]
description = "Validate separately pinned SSH hops and bounded direct-tcpip relay"
run = "cargo run -p xtask --features ssh-probe --locked -- probe-ssh-jump"

[tasks.probe-ssh-certificate]
description = "Validate trusted CA, principal, validity and restrictive SSH certificate policy"
run = "cargo run -p xtask --features ssh-probe --locked -- probe-ssh-certificate"

[tasks.probe-ssh-agent]
description = "Validate an isolated software SSH Agent signer without ambient identities"
run = "cargo run -p xtask --features ssh-probe --locked -- probe-ssh-agent"

[tasks.probe-ssh-legacy]
description = "Validate test-only explicit legacy KEX/MAC while secure defaults reject"
run = "cargo run -p xtask --features ssh-probe --locked -- probe-ssh-legacy"

[tasks.probe-encoding-attachment]
description = "Validate dual-coordinate actor recovery and GBK headless rendering"
run = ["cargo xtask probe-encoding-attachment", "pnpm --filter ui exec tsx scripts/encoding-attachment-probe.ts"]

[tasks.desktop-build]
description = "Build the native WebView validation app"
run = ["pnpm --filter ui build", "cargo build -p pulseterm-desktop --features desktop --locked"]

[tasks.desktop-encoding-build]
description = "Build explicit classified-GBK validation app, not the default desktop"
run = ["pnpm --filter ui build", "cargo build -p pulseterm-desktop --features encoding-probe --locked"]

[tasks.probe-encoding-window]
description = "Validate GBK dual-coordinate recovery through actual Channel and DOM callbacks"
depends = ["desktop-encoding-build"]
run = "cargo xtask probe-encoding-window"

[tasks.desktop-login-build]
description = "Build finite-helper Unix login validation app, not the default desktop"
run = ["pnpm --filter ui build", "cargo build -p pulseterm-desktop --features login-probe --locked"]

[tasks.probe-login-window]
description = "Validate fixed login profile through actual PTY, Channel and DOM callbacks"
depends = ["desktop-login-build"]
run = "cargo xtask probe-login-window"

[tasks.desktop-check]
description = "Check desktop adapter and frontend assets"
run = ["pnpm --filter ui build", "cargo clippy -p pulseterm-desktop --features desktop --all-targets --locked -- -D warnings"]

[tasks.desktop]
description = "Run the native validation app"
depends = ["desktop-build"]
run = "cargo run -p pulseterm-desktop --features desktop --locked"

[tasks.probe-channel]
description = "Measure real WebView Channel and loopback WebSocket"
depends = ["desktop-build"]
run = "cargo xtask probe-channel"

[tasks.probe-channel-v2]
description = "Validate explicit dual-coordinate bindings in the real UTF-8 WebView sample"
depends = ["desktop-build"]
run = "cargo xtask probe-channel-v2"

[tasks.probe-window]
description = "Validate native minimize/resume under isolated Linux X11/Openbox"
depends = ["desktop-build"]
run = "cargo xtask probe-window"

[tasks.probe-window-external]
description = "Validate external WM-only minimize/resume of the finite terminal view"
depends = ["desktop-build"]
run = "cargo xtask probe-window-external"

[tasks.bindings]
description = "Generate typed IPC commands, events and DTOs from Rust"
run = "cargo run -p pulseterm-desktop --features desktop --locked -- --export-bindings"

[tasks.bindings-check]
description = "Check committed IPC bindings without overwriting them"
run = "cargo run -p pulseterm-desktop --features desktop --locked -- --check-bindings"

[tasks.audit]
description = "Audit Rust dependency licenses and advisories"
run = ["cargo deny --all-features --locked check", "pnpm audit --audit-level moderate"]
