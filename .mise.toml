trap 'rm -rf -- "$fixture_dir"' EXIT
export TMPDIR="$fixture_dir" TMP="$fixture_dir" TEMP="$fixture_dir"
export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$fixture_dir/target}"
cargo test -p xtask --features ssh-target-probe --locked scope_fixture::tests
pnpm --filter ui exec vite build --configLoader runner --outDir "$fixture_dir/ui-dist"
export TAURI_CONFIG=$(printf '{"build":{"frontendDist":"%s/ui-dist"}}' "$fixture_dir")
cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --features workspace-cli,workspace-ssh,tauri/custom-protocol --bin pulseterm-workspace --bin pulse --locked
cargo build -p xtask --features ssh-target-probe --locked
cc -std=c11 -Wall -Wextra -Werror scripts/probe-workspace-system-appearance.c -o "$fixture_dir/system-appearance" $(pkg-config --cflags --libs gio-unix-2.0)
export PULSE_SSH_APPEARANCE_HELPER="$fixture_dir/system-appearance"
cc -Wall -Wextra -Werror scripts/probe-x11-status.c -o "$fixture_dir/x11-status" $(pkg-config --cflags --libs x11 atspi-2 gio-2.0 gobject-2.0 glib-2.0)
export PULSE_NATIVE_HELPER="$fixture_dir/x11-status"
export PULSE_SSH_TEST_SERVER="$CARGO_TARGET_DIR/debug/xtask"
timeout --kill-after=5s 180s xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- sh scripts/probe-window-x11.sh target/probes/workspace-ssh-settings-wm.log python3 scripts/probe-workspace-cold-ssh.py
"""

[tasks.probe-workspace-echo]
