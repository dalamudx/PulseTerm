[tasks.probe-workspace-load]
description = "Verify release WebView with real cat 1GiB, tty Ctrl+C latency and native exit"
env = { GDK_BACKEND = "x11", LIBGL_ALWAYS_SOFTWARE = "1", WEBKIT_DISABLE_DMABUF_RENDERER = "1", PYTHONDONTWRITEBYTECODE = "1" }
run = """
