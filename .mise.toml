[tools]
rust = "1.95.0"
node = "22.23.3"
pnpm = "10.34.6"
"cargo:cargo-deny" = "0.20.2"

[tasks.bootstrap]
description = "Install JavaScript dependencies from the lockfile"
run = "pnpm install --frozen-lockfile"

[tasks.check]
description = "Check Rust and TypeScript code"
run = ["cargo xtask check", "pnpm --filter ui check"]

[tasks.check-core-features]
description = "Check all features and targets of the platform, store, PTY and application core on the current platform"
run = "cargo check -p pulse-platform -p pulse-store -p pulse-pty -p pulse-app --all-features --all-targets --locked"

[tasks.check-platform]
description = "Strictly check platform policies; Windows also runs native private directory and file tests"
run = ["cargo clippy -p pulse-platform --all-targets --locked -- -D warnings", "cargo test -p pulse-platform --all-targets --locked"]

[tasks.check-ssh-adapters]
description = "Strictly check standalone SSH probes and the complete production SSH workspace adapter"
run = ["cargo clippy -p xtask --features ssh-target-probe --all-targets --locked -- -D warnings", "cargo clippy -p pulseterm-desktop --features workspace-cli,workspace-ssh --all-targets --locked -- -D warnings"]

[tasks.check-startup-diagnostics]
description = "Check opt-in fixed-code startup traces and reject incomplete or content-bearing native receipts"
run = """
set -eu
case "$(uname -s)" in Linux) ;; *) echo "startup diagnostics requires Linux" >&2; exit 2 ;; esac
mkdir -p /data/temp
startup_check_tmp=$(mktemp -d /data/temp/pt-startup-check.XXXXXX)
trap 'rm -rf -- "$startup_check_tmp"' EXIT
export TMPDIR="$startup_check_tmp" TMP="$startup_check_tmp" TEMP="$startup_check_tmp"
cargo test -p pulseterm-desktop --lib --features workspace-startup-diagnostics,workspace-ssh --locked product_workspace::startup_diagnostics
cargo clippy -p pulseterm-desktop --features workspace-startup-diagnostics,workspace-ssh --all-targets --locked -- -D warnings
python3 scripts/test-workspace-startup-traces.py
"""

[tasks.test]
description = "Run unit and shared-fixture tests"
run = ["cargo test --workspace --locked", "pnpm --filter ui test"]

[tasks.clean-dev]
description = "Clean dev/test debug artifacts after an acceptance batch; preserve target/probes evidence"
run = "cargo clean --profile dev"

[tasks.probe]
description = "Compare Rust terminal state and xterm headless"
run = ["cargo xtask probe", "pnpm --filter ui probe"]

[tasks.probe-route-ssh-pressure]
description = "Verify real SSH ACK pressure, detach and timeout through HTTP and SOCKS byte routes"
run = "cargo run -p xtask --features ssh-probe --locked -- probe-route-ssh-pressure"

[tasks.probe-route]
description = "Exercise real HTTP CONNECT and SOCKS5 byte-route composition and refusal"
run = "cargo xtask probe-route"

[tasks.probe-software]
description = "Record vim/less/htop/tmux native streams and compare headless recovery"
run = ["cargo xtask probe-software", "pnpm --filter ui exec tsx scripts/software-probe.ts"]

[tasks.probe-local-session]
description = "Exercise the supervised native PTY to terminal actor bridge"
run = "cargo xtask probe-local-session"

[tasks.probe-pty-portable]
description = "Exercise native PTY with a platform-neutral finite Rust helper"
run = "cargo xtask probe-pty-portable"

[tasks.probe-local-profile-session]
description = "Validate login profile bootstrap to terminal actor, authorized ACK backpressure and EOF"
run = "cargo xtask probe-local-profile-session"

[tasks.probe-login-arguments]
description = "Validate explicit Unix login arguments, literal profile argv and no program fallback"
run = "cargo xtask probe-login-arguments"

[tasks.probe-theme-file]
description = "Verify four independent background theme IO processes, cancelled handoff, UUID slots, reopening and rejected stale saves"
run = "cargo run -p xtask --features cli-probe -- probe-theme-file"

[tasks.probe-theme]
description = "Verify seven theme imports, explicit base projection, complete TOML, bounded paint images and WCAG warnings"
run = "cargo xtask probe-theme"

[tasks.probe-theme-paint]
description = "Verify actual Rust theme paint JSON through strict decoding and complete Radix UI resolution without DOM writes"
run = "cargo build -p xtask --features cli-probe --locked && pnpm --dir ui exec tsx scripts/theme-paint-probe.ts"

[tasks.probe-shell-startup]
description = "Validate isolated Bash startup config, scalar/array hooks and OSC prompt boundaries"
run = "cargo xtask probe-shell-startup"

[tasks.probe-login]
description = "Validate Unix public login builder argv0 and fallback limitations"
run = "cargo xtask probe-login"

[tasks.probe-store-owner]
description = "Exercise foreign-owner refusal using disposable fixtures; requires existing effective UID 0, never elevates"
run = ["node --test scripts/probe-store-owner.test.mjs", "node scripts/probe-store-owner.mjs"]

[tasks.check-store-owner-probe]
description = "Verify owner probe admission and refusal of zero or mismatched test receipts; no privileges required"
run = "node --test scripts/probe-store-owner.test.mjs"

[tasks.probe-settings-source]
description = "Verify bounded background user settings reads, exact coalescing and owner/worker retirement"
run = ["node --test scripts/probe-settings-source.test.mjs", "node scripts/probe-settings-source.mjs"]

[tasks.check-settings-source-probe]
description = "Reject unsupported platforms, zero, substituted and incomplete source test receipts"
run = "node --test scripts/probe-settings-source.test.mjs"

[tasks.probe-settings-file]
description = "Verify fixed private settings saves, strict conflict receipts and actual process-kill atomicity"
run = ["node --test scripts/probe-settings-file.test.mjs", "node scripts/probe-settings-file.mjs"]

[tasks.check-settings-file-probe]
description = "Reject unsupported platforms, zero tests and incomplete settings save receipts"
run = "node --test scripts/probe-settings-file.test.mjs"

[tasks.probe-store-crash]
description = "Verify SQLite transaction and uncheckpointed WAL recovery after actual process termination"
run = "cargo test -p pulse-store --locked --test crash_recovery"

[tasks.probe-settings-scope]
description = "Verify scoped SQLite edits and actual private user file resolution across five processes"
run = ["cargo test -p xtask --features cli-probe --locked settings_scope_probe", "cargo run -p xtask --features cli-probe --locked -- probe-settings-scope"]

[tasks.probe-profile-store]
description = "Verify concurrent SQLite edits, stale snapshot refusal and independent process restarts"
run = ["cargo test -p xtask --features cli-probe --locked profile_store", "cargo run -p xtask --features cli-probe --locked -- probe-profile-store"]

[tasks.probe-profiles]
description = "Exercise Unix shell discovery, profile reconciliation and literal native launch"
run = "cargo xtask probe-profiles"

[tasks.probe-pty]
description = "Exercise native PTY input, queries, resize, output and teardown"
run = "cargo xtask probe-pty"

[tasks.unicode-table]
description = "Generate xterm scalar widths from locked Rust Unicode table"
run = "cargo xtask unicode-table"

[tasks.unicode-table-check]
description = "Check deterministic shared width table without writing"
run = "cargo xtask unicode-table-check"

[tasks.probe-unicode]
description = "Compare explicit character and grapheme providers (diagnostic, not S2 acceptance)"
depends = ["probe"]
run = "pnpm --filter ui exec tsx scripts/unicode-probe.ts"

[tasks.probe-attachment]
description = "Validate binary reconnect ordering, history, UTF-8 tails and rendering ACKs"
run = ["cargo xtask probe-attachment", "pnpm --filter ui exec tsx scripts/attachment-probe.ts"]

[tasks.probe-snapshot]
description = "Check exact restore continuations; report parser disagreements separately"
run = [
  "cargo xtask probe-snapshot",
  "pnpm --filter ui exec tsx scripts/snapshot-probe.ts",
  "pnpm --filter ui exec tsx scripts/token-matrix.ts",
]

[tasks.terminal-vendor-check]
description = "Verify locked terminal source differs only by the approved getter"
run = "node scripts/check-terminal-vendor.mjs"

[tasks.terminal-vendor-test]
description = "Run upstream terminal tests with isolated locked dependencies"
run = "node scripts/check-terminal-vendor.mjs --test"

[tasks.terminal-api-check]
description = "Prove production terminal API cannot use legacy replay or EchoTransport"
run = "node scripts/check-terminal-api.mjs"

[tasks.fmt]
description = "Format Rust and TypeScript code"
run = ["cargo fmt --all", "pnpm --filter ui format"]

[tasks.desktop-cli-build]
description = "Build explicit fixed CLI-to-window validation adapter"
run = ["pnpm --filter ui build", "cargo build -p pulseterm-desktop --features cli-window-probe --locked"]

[tasks.probe-cli-window]
description = "Measure authenticated CLI request to real native window receipts"
depends = ["desktop-cli-build"]
run = "cargo run -p xtask --features cli-probe --locked -- probe-cli-window"

[tasks.probe-cli-startup]
description = "Validate fixed CLI runtime election, live endpoint preservation and owned crash recovery"
run = "cargo run -p xtask --features cli-probe --locked -- probe-cli-startup"

[tasks.probe-cli]
description = "Validate authenticated fixed read-only CLI RPC over a private Unix socket"
run = "cargo run -p xtask --features cli-probe --locked -- probe-cli"

[tasks.probe-ssh]
description = "Validate isolated loopback SSH host keys, authentication and PTY channels"
run = "cargo run -p xtask --features ssh-probe --locked -- probe-ssh"

[tasks.probe-ssh-target]
description = "Validate private saved source/page/original epoch preconditions with actual SSH peer guard; no credential use"
run = "cargo run -p xtask --features ssh-target-probe --locked -- probe-ssh-target"

[tasks.probe-ssh-password-use]
description="Validate explicit backend Vault password action into actual fixed SSH peer with native drain; no plaintext/session IPC"
run="cargo run -p xtask --features ssh-target-probe --locked -- probe-ssh-password-use"

[tasks.probe-ssh-private-key-use]
description = "Validate bounded OpenSSH Ed25519 Vault ciphertext to actual signed SSH auth and resource exit; no product key entry"
run = "cargo run -p xtask --features ssh-private-key-probe --locked -- probe-ssh-private-key-use"
[tasks.probe-ssh-private-key-session]
description = "Validate encrypted OpenSSH Ed25519 session handoff, stale source and setup revocation, shared root navigation, resize notification, EOF and native exit; no WebView claim"
run = "cargo run -p xtask --features ssh-private-key-probe --locked -- probe-ssh-private-key-session"
[tasks.probe-ssh-owned-session]
description = "Validate explicit saved-ciphertext SSH session handoff to root actor across navigation, EOF and native read cancellation; no product/resize/GUI claim"
run = "cargo run -p xtask --features ssh-target-probe --locked -- probe-ssh-owned-session"

[tasks.probe-ssh-first-pin]
description = "Validate actual offered key and original registry page through atomic first-use pin approval; auth stays zero"
run = "cargo run -p xtask --features ssh-target-probe --locked -- probe-ssh-first-pin"

[tasks.probe-ssh-system]
description = "Validate russh against an isolated real OpenSSH server and native PTY"
run = "cargo run -p xtask --features ssh-probe --locked -- probe-ssh-system"

[tasks.probe-ssh-pressure]
description = "Verify remote SSH stalls on withheld ACK and expose connection-level blocking"
run = "cargo run -p xtask --features ssh-probe --locked -- probe-ssh-pressure"

[tasks.probe-ssh-jump]
description = "Validate separately pinned SSH hops and bounded direct-tcpip relay"
run = "cargo run -p xtask --features ssh-probe --locked -- probe-ssh-jump"

[tasks.probe-ssh-certificate]
description = "Validate trusted CA, principal, validity and restrictive SSH certificate policy"
run = "cargo run -p xtask --features ssh-probe --locked -- probe-ssh-certificate"

[tasks.probe-ssh-agent]
description = "Validate an isolated software SSH Agent signer without ambient identities"
run = "cargo run -p xtask --features ssh-probe --locked -- probe-ssh-agent"

[tasks.probe-ssh-legacy]
description = "Validate test-only explicit legacy KEX/MAC while secure defaults reject"
run = "cargo run -p xtask --features ssh-probe --locked -- probe-ssh-legacy"

[tasks.probe-encoding-attachment]
description = "Validate dual-coordinate actor recovery and GBK headless rendering"
run = ["cargo xtask probe-encoding-attachment", "pnpm --filter ui exec tsx scripts/encoding-attachment-probe.ts"]

[tasks.desktop-build]
description = "Build the native WebView validation app"
run = ["pnpm --filter ui build", "cargo build -p pulseterm-desktop --features desktop --locked"]

[tasks.desktop-encoding-build]
description = "Build explicit classified-GBK validation app, not the default desktop"
run = ["pnpm --filter ui build", "cargo build -p pulseterm-desktop --features encoding-probe --locked"]

[tasks.probe-encoding-window]
description = "Validate GBK dual-coordinate recovery through actual Channel and DOM callbacks"
depends = ["desktop-encoding-build"]
run = "cargo xtask probe-encoding-window"

[tasks.desktop-settings-build]
description = "Build isolated native configuration receipt adapter, not default desktop"
run = ["pnpm --filter ui build", "cargo build -p pulseterm-desktop --features settings-probe --locked"]

[tasks.probe-settings-window]
description = "Validate fixed configuration and theme provenance and retirement with actual native windows"
depends = ["desktop-settings-build"]
run = "cargo xtask probe-settings-window"

[tasks.workspace-preview-build]
description = "Build separate opt-in workspace assets before embedding them in Tauri"
run = ["pnpm --filter ui build", "cargo build -p pulseterm-desktop --bin pulseterm-workspace --features workspace --locked"]

[tasks.workspace-webgl-probe-build]
description = "Build fixed public-canvas observer for actual WebGL validation only"
run = ["pnpm --filter ui build", "cargo build -p pulseterm-desktop --bin pulseterm-workspace --features validation-probe-webgl --locked"]

[tasks.workspace-ssh-preview-build]
description = "Build opt-in saved-host fingerprint and Vault-password SSH workspace after fresh UI assets"
run = ["pnpm --filter ui build", "cargo build -p pulseterm-desktop --bin pulseterm-workspace --features workspace-ssh --locked"]

[tasks.probe-workspace-cli-ssh]
description = "Verify original-window saved-host/identity CLI consent, Vault lock rejection, cancellation/navigation, one real ciphertext authentication and native drain"
run = ["pnpm --filter ui build", "cargo build -p pulseterm-desktop --features workspace-cli,workspace-ssh --bin pulseterm-workspace --bin pulse --locked", "cargo build -p xtask --bin xtask --features ssh-target-probe --locked", "timeout --kill-after=5s 90s xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- sh scripts/probe-window-x11.sh target/probes/workspace-cli-ssh-wm.log sh scripts/probe-workspace-ssh-session.sh cli"]

[tasks.probe-workspace-cli-ssh-private-key]
description = "Verify saved-key CLI original-window approval, lock/cancel/disconnect/navigation/source rejection, one real signature and terminal refresh/drain"
run = ["pnpm --filter ui build", "cargo build -p pulseterm-desktop --features workspace-cli,workspace-ssh --bin pulseterm-workspace --bin pulse --locked", "cargo build -p xtask --bin xtask --features ssh-private-key-probe --locked", "timeout --kill-after=5s 90s xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- sh scripts/probe-window-x11.sh target/probes/workspace-cli-ssh-private-key-wm.log sh scripts/probe-workspace-ssh-session.sh key-cli"]
[tasks.probe-workspace-cli-ssh-agent]
description = "Verify saved Agent CLI lock/cancel/navigation/disconnect refusal, original-window consent, one selected signature and refresh/reopen/drain"
run = ["pnpm --filter ui build", "cargo build -p pulseterm-desktop --features workspace-cli,workspace-ssh --bin pulseterm-workspace --bin pulse --locked", "cargo build -p xtask --bin xtask --features ssh-private-key-probe --locked", "mkdir -p target/probes", "cc -Wall -Wextra -Werror scripts/probe-x11-status.c -o target/probes/x11-status $(pkg-config --cflags --libs atspi-2 gio-2.0 gobject-2.0 glib-2.0)", "PULSE_CLI_AGENT=1 timeout --kill-after=5s 120s xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- sh scripts/probe-window-x11.sh target/probes/ssh-agent-cli-wm.log sh scripts/probe-workspace-recent-hosts.sh"]

[tasks.probe-workspace-cli-ssh-route]
description = "Verify CLI original-snapshot mixed Agent jump route, first-peer cancel zero auth, three approvals, selected signatures, refresh/reopen and parent native exit"
run = ["pnpm --filter ui build", "cargo build -p pulseterm-desktop --features workspace-cli,workspace-ssh --bin pulseterm-workspace --bin pulse --locked", "cargo build -p xtask --bin xtask --features ssh-private-key-probe --locked", "mkdir -p target/probes", "cc -Wall -Wextra -Werror scripts/probe-x11-status.c -o target/probes/x11-status $(pkg-config --cflags --libs atspi-2 gio-2.0 gobject-2.0 glib-2.0)", "PULSE_CLI_ROUTE=1 timeout --kill-after=5s 120s xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- sh scripts/probe-window-x11.sh target/probes/ssh-agent-cli-route-wm.log sh scripts/probe-workspace-recent-hosts.sh"]


[tasks.probe-workspace-fingerprint]
description = "Verify explicit fingerprint cancel/approve/matched/changed/reload/reopen against independent OpenSSH with zero authentication"
depends = ["workspace-ssh-preview-build"]
run = "timeout --kill-after=5s 80s xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- sh scripts/probe-window-x11.sh target/probes/workspace-fingerprint-wm.log sh scripts/probe-workspace-fingerprint.sh"

[tasks.probe-workspace-ssh-session]
description = "Verify opt-in saved Vault ciphertext SSH in real Linux WebView with input, refresh, transport-specific resize, confirmed close, ended-page recovery, handshake cancellation and native drain"
depends = ["workspace-ssh-preview-build"]
run = ["cargo build -p xtask --bin xtask --features ssh-target-probe --locked", "timeout --kill-after=5s 80s xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- sh scripts/probe-window-x11.sh target/probes/workspace-ssh-session-wm-window.log sh scripts/probe-workspace-ssh-session.sh window", "timeout --kill-after=5s 80s xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- sh scripts/probe-window-x11.sh target/probes/workspace-ssh-session-wm-close.log sh scripts/probe-workspace-ssh-session.sh close", "timeout --kill-after=5s 80s xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- sh scripts/probe-window-x11.sh target/probes/workspace-ssh-session-wm-eof.log sh scripts/probe-workspace-ssh-session.sh eof", "timeout --kill-after=5s 80s xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- sh scripts/probe-window-x11.sh target/probes/workspace-ssh-session-wm-cancel.log sh scripts/probe-workspace-ssh-session.sh cancel", "timeout --kill-after=5s 80s xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- sh scripts/probe-window-x11.sh target/probes/workspace-ssh-session-wm-commands.log sh scripts/probe-workspace-ssh-session.sh commands"]

[tasks.probe-workspace-recent-hosts]
description = "Verify one real successful saved SSH recent target, cancel zero writes, original approval, source invariance, refresh and reopen"
depends = ["workspace-ssh-preview-build"]
run = ["cargo build -p xtask --bin xtask --features ssh-target-probe --locked", "mkdir -p target/probes", "cc -Wall -Wextra -Werror scripts/probe-x11-status.c -o target/probes/x11-status $(pkg-config --cflags --libs atspi-2 gio-2.0 gobject-2.0 glib-2.0)", "timeout --kill-after=5s 100s xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- sh scripts/probe-window-x11.sh target/probes/recent-host-wm.log sh scripts/probe-workspace-recent-hosts.sh"]

[tasks.probe-workspace-fuzzy-search]
description = "Verify noncontiguous and multi-term metadata search, saved target preselection, cancellation zero writes and normal exit"
depends = ["workspace-ssh-preview-build"]
run = ["cargo build -p xtask --bin xtask --features ssh-target-probe --locked", "mkdir -p target/probes", "cc -Wall -Wextra -Werror scripts/probe-x11-status.c -o target/probes/x11-status $(pkg-config --cflags --libs atspi-2 gio-2.0 gobject-2.0 glib-2.0)", "PULSE_FUZZY_SEARCH=1 timeout --kill-after=5s 70s xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- sh scripts/probe-window-x11.sh target/probes/fuzzy-search-wm.log sh scripts/probe-workspace-recent-hosts.sh"]

[tasks.probe-workspace-host-endpoints]
description = "Verify legacy-only read/cancel zero writes, explicit machine migration, a second saved SSH entrance, independent naming, tombstones, original target, refresh and process reopen without authentication"
depends = ["workspace-ssh-preview-build"]
run = ["cargo build -p xtask --bin xtask --features ssh-target-probe --locked", "mkdir -p target/probes", "cc -Wall -Wextra -Werror scripts/probe-x11-status.c -o target/probes/x11-status $(pkg-config --cflags --libs atspi-2 gio-2.0 gobject-2.0 glib-2.0)", "PULSE_HOST_ENDPOINTS=1 timeout --kill-after=5s 100s xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- sh scripts/probe-window-x11.sh target/probes/host-endpoint-wm.log sh scripts/probe-workspace-recent-hosts.sh"]

[tasks.probe-workspace-temporary-ssh]
description = "Verify temporary target cancellation, explicit original SSH approval, skip-save session retention, registered-only saving, recent binding, refresh and reopen"
depends = ["workspace-ssh-preview-build"]
run = ["cargo build -p xtask --bin xtask --features ssh-target-probe --locked", "mkdir -p target/probes", "cc -Wall -Wextra -Werror scripts/probe-x11-status.c -o target/probes/x11-status $(pkg-config --cflags --libs atspi-2 gio-2.0 gobject-2.0 glib-2.0)", "PULSE_TEMPORARY_SSH=1 timeout --kill-after=5s 100s xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- sh scripts/probe-window-x11.sh target/probes/temporary-ssh-wm.log sh scripts/probe-workspace-recent-hosts.sh"]

[tasks.probe-workspace-ssh-route]
description = "Verify real nested SSH routing, per-peer explicit approval, cancel zero auth, first pins, leaf-only terminal, refresh/reopen and ordered native exit"
depends = ["workspace-ssh-preview-build"]
run = ["cargo build -p xtask --bin xtask --features ssh-private-key-probe --locked", "mkdir -p target/probes", "cc -Wall -Wextra -Werror scripts/probe-x11-status.c -o target/probes/x11-status $(pkg-config --cflags --libs atspi-2 gio-2.0 gobject-2.0 glib-2.0)", "PULSE_SSH_ROUTE=1 timeout --kill-after=5s 120s xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- sh scripts/probe-window-x11.sh target/probes/ssh-route-wm.log sh scripts/probe-workspace-recent-hosts.sh"]

[tasks.probe-workspace-ssh-agent]
description = "Verify explicit Agent key saving, cancel zero writes/signs, selected-key-only terminal, refresh/reopen and physical exit"
depends = ["workspace-ssh-preview-build"]
run = ["cargo build -p xtask --bin xtask --features ssh-private-key-probe --locked", "mkdir -p target/probes", "cc -Wall -Wextra -Werror scripts/probe-x11-status.c -o target/probes/x11-status $(pkg-config --cflags --libs atspi-2 gio-2.0 gobject-2.0 glib-2.0)", "PULSE_SSH_AGENT=1 timeout --kill-after=5s 120s xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- sh scripts/probe-window-x11.sh target/probes/ssh-agent-wm.log sh scripts/probe-workspace-recent-hosts.sh"]

[tasks.probe-workspace-ssh-jump-config]
description = "Verify saved SSH Profile jump reference, cancellation zero writes, original-source invariance, refresh/process reopen and explicit detach without authentication"
depends = ["workspace-ssh-preview-build"]
run = ["cargo build -p xtask --bin xtask --features ssh-target-probe --locked", "mkdir -p target/probes", "cc -Wall -Wextra -Werror scripts/probe-x11-status.c -o target/probes/x11-status $(pkg-config --cflags --libs atspi-2 gio-2.0 gobject-2.0 glib-2.0)", "PULSE_SSH_JUMPS=1 timeout --kill-after=5s 100s xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- sh scripts/probe-window-x11.sh target/probes/ssh-jump-config-wm.log sh scripts/probe-workspace-recent-hosts.sh"]

[tasks.probe-workspace-ssh-profiles]
description = "Verify independent SSH preference and default identity metadata save, original preselection/cancel, immutable credential/trust data, refresh and process reopen without authentication"
depends = ["workspace-ssh-preview-build"]
run = ["cargo build -p xtask --bin xtask --features ssh-target-probe --locked", "mkdir -p target/probes", "cc -Wall -Wextra -Werror scripts/probe-x11-status.c -o target/probes/x11-status $(pkg-config --cflags --libs atspi-2 gio-2.0 gobject-2.0 glib-2.0)", "PULSE_SSH_PROFILES=1 timeout --kill-after=5s 100s xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- sh scripts/probe-window-x11.sh target/probes/ssh-profile-wm.log sh scripts/probe-workspace-recent-hosts.sh"]

[tasks.probe-workspace-quick-connect]
description = "Verify quick target preview, invalid/cancel zero writes, saved reuse, one IPv6 save, original SSH form, refresh and process reopen without a new authentication matrix"
