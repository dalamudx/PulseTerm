[tasks.probe-workspace-native-close]
description = "Diagnose bounded locked/unlocked GUI cancellation-close cycles; exact exit0, zero authentication/signatures/writes and endpoint drain, optional owned gdb stacks"
run = """
set -eu
mkdir -p /data/temp target/probes
fixture_dir=$(mktemp -d /data/temp/pt-close.XXXXXX)
trap 'rm -rf -- "$fixture_dir"' EXIT
export TMPDIR="$fixture_dir" TMP="$fixture_dir" TEMP="$fixture_dir"
export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$fixture_dir/target}"
cc -Wall -Wextra -Werror scripts/probe-x11-status.c -o "$fixture_dir/x11-status" $(pkg-config --cflags --libs atspi-2 gio-2.0 gobject-2.0 glib-2.0)
pnpm --filter ui exec vite build --outDir "$fixture_dir/ui-dist"
export TAURI_CONFIG=$(printf '{"build":{"frontendDist":"%s/ui-dist"}}' "$fixture_dir")
case "${PULSE_STARTUP_DIAGNOSTICS:-0}" in
    0) native_features=workspace-cli,workspace-ssh,tauri/custom-protocol ;;
    1) native_features=workspace-cli,workspace-ssh,tauri/custom-protocol,workspace-startup-diagnostics
       test -n "${PULSE_WORKSPACE_STARTUP_TRACE_DIR:-}"
       mkdir -p target/probes/workspace-startup-trace/current
       printf '%s' '{"version":1,"passed":false,"stage":"not_completed","historical_startup_or_sigsegv_resolved":false}' > target/probes/workspace-startup-trace/current/result.json ;;
    *) echo 'invalid startup diagnostics mode' >&2; exit 2 ;;
esac
cargo build -p pulseterm-desktop --features "$native_features" --bin pulseterm-workspace --bin pulse --locked
cargo build -p xtask --bin xtask --features ssh-private-key-probe --locked
export PULSE_NATIVE_HELPER="$fixture_dir/x11-status"
export PULSE_SSH_FIXTURE_EXECUTABLE="$CARGO_TARGET_DIR/debug/xtask"
sh scripts/probe-workspace-native-close.sh
if [ "${PULSE_STARTUP_DIAGNOSTICS:-0}" = 1 ]; then
    python3 scripts/check-workspace-startup-traces.py "$PULSE_WORKSPACE_STARTUP_TRACE_DIR" target/probes/workspace-startup-trace/current --phase "${PULSE_COLD_CLOSE_PHASE:-settled}" --cycles "${PULSE_COLD_CLOSE_CYCLES:-12}"
fi
"""

