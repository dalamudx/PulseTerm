[workspace]
resolver = "3"
exclude = ["vendor/alacritty_terminal"]
members = ["crates/pulse-platform", "crates/pulse-store", "crates/pulse-core", "crates/pulse-ipc", "crates/pulse-term", "crates/pulse-pty", "crates/pulse-route", "crates/pulse-ssh", "crates/pulse-app", "crates/pulse-cap", "apps/desktop/src-tauri", "xtask"]
default-members = ["crates/pulse-platform", "crates/pulse-store", "crates/pulse-core", "crates/pulse-ipc", "crates/pulse-term", "crates/pulse-pty", "crates/pulse-route", "crates/pulse-ssh", "crates/pulse-app", "crates/pulse-cap", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
interprocess = { version = "=2.4.5", default-features = false, features = ["tokio"] }
clap = { version = "=4.6.1", features = ["derive"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "backup"] }
rusqlite_migration = "=2.6.0"
rustix = { version = "=1.1.5", features = ["process"] }
pulse-store = { path = "crates/pulse-store", version = "0.1.0" }
pulse-platform = { path = "crates/pulse-platform", version = "0.1.0" }
alacritty_terminal = "=0.26.0"
portable-pty = "=0.9.0"
log = "=0.4.34"
unicode-width = "=0.2.2"
anyhow = "1"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "=1.10.1"
yaml-rust2 = { version = "=0.13.0", default-features = false }
quick-xml = { version = "=0.42.0", default-features = false }
subtle = "=2.6.1"
zeroize = "=1.9.0"
argon2 = { version = "=0.6.0", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "=0.4.3"
regex = "=1.13.1"
schemars = "=1.2.2"
toml = { version = "=1.1.6", default-features = false, features = ["std", "serde", "parse"] }
toml_edit = { version = "=0.25.15", default-features = false, features = ["parse", "display"] }
tempfile = "3"
base64 = "=0.22.1"
thiserror = "2"
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSURL"] }
tauri = "=2.12.4"
tauri-plugin-single-instance = "=2.5.3"
zbus = "5.9"
tauri-build = "=2.7.3"
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "=0.0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", features = ["sink"] }
uuid = { version = "1", features = ["v4"] }

pulse-cap = { path = "crates/pulse-cap", version = "0.1.0" }
pulse-core = { path = "crates/pulse-core", version = "0.1.0" }
pulse-ipc = { path = "crates/pulse-ipc", version = "0.1.0" }
pulse-term = { path = "crates/pulse-term", version = "0.1.0" }
pulse-pty = { path = "crates/pulse-pty", version = "0.1.0" }
pulse-app = { path = "crates/pulse-app", version = "0.1.0" }
pulse-route = { path = "crates/pulse-route", version = "0.1.0" }
pulse-ssh = { path = "crates/pulse-ssh", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Approved read-only inactive-grid API patch; see vendor/README.md.
[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }

# Keep preview/debug KDF arithmetic optimized without changing its fixed cost or admission/deadlines.
[profile.dev.package.argon2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
