[workspace]
resolver = "3"
exclude = ["vendor/alacritty_terminal"]
members = ["crates/pulse-store", "crates/pulse-core", "crates/pulse-ipc", "crates/pulse-term", "crates/pulse-pty", "crates/pulse-route", "crates/pulse-app", "apps/desktop/src-tauri", "xtask"]
default-members = ["crates/pulse-store", "crates/pulse-core", "crates/pulse-ipc", "crates/pulse-term", "crates/pulse-pty", "crates/pulse-route", "crates/pulse-app", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "backup"] }
rusqlite_migration = "=2.6.0"
pulse-store = { path = "crates/pulse-store", version = "0.1.0" }
alacritty_terminal = "=0.26.0"
portable-pty = "=0.9.0"
unicode-width = "=0.2.2"
anyhow = "1"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "=2.6.1"
zeroize = "=1.9.0"
tempfile = "3"
base64 = "=0.22.1"
thiserror = "2"
tauri = "=2.12.1"
tauri-build = "=2.7.1"
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "=0.0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", features = ["sink"] }
uuid = { version = "1", features = ["v4"] }

pulse-core = { path = "crates/pulse-core", version = "0.1.0" }
pulse-ipc = { path = "crates/pulse-ipc", version = "0.1.0" }
pulse-term = { path = "crates/pulse-term", version = "0.1.0" }
pulse-pty = { path = "crates/pulse-pty", version = "0.1.0" }
pulse-app = { path = "crates/pulse-app", version = "0.1.0" }
pulse-route = { path = "crates/pulse-route", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Approved read-only inactive-grid API patch; see vendor/README.md.
[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }

[profile.release]
lto = "thin"
codegen-units = 1
