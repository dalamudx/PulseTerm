[workspace]
resolver = "3"
members = ["crates/pulse-core", "crates/pulse-ipc", "crates/pulse-term", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
alacritty_terminal = "=0.26.0"
anyhow = "1"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
pulse-core = { path = "crates/pulse-core", version = "0.1.0" }
pulse-ipc = { path = "crates/pulse-ipc", version = "0.1.0" }
pulse-term = { path = "crates/pulse-term", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
