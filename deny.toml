[advisories]
version = 2

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9
exceptions = [
  # Exact locked versions approved for MIT project use; MPL executables still need source availability.
  { crate = "cssparser@=0.37.0", allow = ["MPL-2.0"] },
  { crate = "cssparser-macros@=0.7.1", allow = ["MPL-2.0"] },
  { crate = "dtoa-short@=0.3.5", allow = ["MPL-2.0"] },
  { crate = "option-ext@=0.2.0", allow = ["MPL-2.0"] },
  { crate = "selectors@=0.38.0", allow = ["MPL-2.0"] },
  { crate = "doctest-file@=1.1.1", allow = ["0BSD"] },
  { crate = "recvmsg@=1.0.0", allow = ["0BSD"] },
  { crate = "target-lexicon@=0.12.16", allow = ["Apache-2.0 WITH LLVM-exception"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
