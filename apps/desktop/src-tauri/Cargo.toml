[package]
name = "pulseterm-desktop"
default-run = "pulseterm-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
# Classified fixtures only; never enabled by desktop/default or production builds.
encoding-probe = ["desktop", "pulse-term/validation"]
# Finite helper-only login bootstrap, never enabled by desktop/default.
login-probe = ["desktop"]
# Private fixed configuration receipts; no production settings factory or RPC.
settings-probe = ["desktop", "dep:pulse-store", "dep:tempfile"]
cli-window-probe = ["desktop", "dep:tempfile", "dep:zeroize", "tokio/io-util", "tokio/process"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:uuid", "dep:specta", "dep:tauri-specta", "dep:specta-typescript", "dep:pulse-app", "dep:pulse-core", "dep:pulse-term", "dep:pulse-pty"]
# A distinct, native-only workspace entry. No validation command table is registered.
workspace = ["desktop", "dep:pulse-store", "dep:pulse-cap", "dep:schemars", "dep:gtk", "dep:webkit2gtk", "dep:tokio-util", "dep:zeroize"]
# Fixed-code, bounded primary-window traces for explicit Linux diagnosis only.
workspace-startup-diagnostics = ["workspace-cli"]
# Delayed display receipts for Linux native acceptance only; never production.
workspace-readiness-probe = ["workspace-startup-diagnostics"]
# Ordered screen verification commands; absent from ordinary production builds.
workspace-load-state-probe = ["workspace-cli", "rustix/time"]
# Same native services with an authority-free blank page for Linux memory diagnosis only.
workspace-runtime-memory-probe = ["workspace-cli"]
# Opt-in Linux CLI; single-instance/startup foundation never enters default/probe builds.
workspace-cli = ["workspace", "pulse-app/cli-control", "dep:tauri-plugin-single-instance", "dep:zbus", "dep:rustix", "dep:interprocess", "dep:widestring"]
# Opt-in saved-host/identity SSH trust and supervised session entry; default stays network-free.
workspace-ssh = ["workspace", "dep:pulse-ssh", "dep:russh", "dep:pkcs8", "pulse-ssh/managed-store", "pulse-store/ssh-trust", "pulse-app/ssh-use"]
# Fixed public-canvas observer only; never part of default or production builds.
validation-probe-webgl = ["workspace"]

[[bin]]
name = "pulseterm-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "pulseterm-workspace"
path = "src/workspace_main.rs"
required-features = ["workspace"]

[[bin]]
name = "pulse"
path = "src/pulse_main.rs"
required-features = ["workspace-cli"]

[dependencies]
pulse-ipc.workspace = true
pulse-cap = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
pulse-app = { workspace = true, optional = true }
pulse-ssh = { workspace = true, optional = true }
russh = { version = "=0.63.3", default-features = false, features = ["ring"], optional = true }
pkcs8 = { version = "=0.11.0", features = ["encryption", "pem"], optional = true }
pulse-store = { workspace = true, optional = true }
pulse-core = { workspace = true, optional = true }
pulse-term = { workspace = true, optional = true }
pulse-pty = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile = { workspace=true, optional=true }
zeroize = { workspace=true, optional=true }
tauri = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
specta = { workspace = true, optional = true }
tauri-specta = { workspace = true, optional = true }
specta-typescript = { workspace = true, optional = true }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
pulse-platform.workspace = true

[target.'cfg(windows)'.dependencies]
interprocess = { workspace = true, optional = true }
widestring = { version = "=1.2.1", optional = true }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "=0.18.2", optional = true }
webkit2gtk = { version = "=2.0.2", features = ["v2_28"], optional = true }
zbus = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { workspace = true, optional = true }
[build-dependencies]
tauri-build = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
rand = "=0.10.3"

[target.'cfg(windows)'.dev-dependencies]
rusqlite.workspace = true

[lints]
workspace = true
